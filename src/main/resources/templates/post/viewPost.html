<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>View Post</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-r from-blue-50 to-blue-100 py-10 min-h-screen">

<div class="max-w-2xl mx-auto bg-white p-8 rounded-2xl shadow-xl hover:shadow-2xl transition-shadow duration-300">
  <h1 class="text-4xl font-extrabold mb-4 text-blue-700 tracking-wide" th:text="${post.title}">Post Title</h1>

  <p class="text-gray-700 mb-4 text-lg">
    <i class="fas fa-align-left text-blue-500 mr-2"></i>
    <span class="font-semibold">Description:</span>
    <span th:text="${post.description}">Post description here</span>
  </p>

  <div class="text-sm text-gray-600 mb-6">
    <i class="fas fa-calendar-alt text-blue-500 mr-2"></i>
    <span class="font-semibold">Date:</span>
    <span th:text="${#dates.format(post.date, 'dd MMM yyyy')}">2025-01-01</span>
  </div>

  <div class="mb-6 rounded overflow-hidden shadow-md">
    <img th:src="@{${post.image}}" alt="Post Image" class="w-full rounded-md hover:scale-105 transition-transform duration-300">
  </div>

  <div class="flex justify-between">
    <!-- Back button -->
    <a th:href="@{/api/posts/{userId}(userId=${post.user.id})}"
       class="flex items-center gap-2 bg-gray-500 text-white px-4 py-2 rounded-full hover:bg-gray-700 transition duration-300">
      <i class="fas fa-arrow-left"></i> Back
    </a>

    <!-- Fixed Edit button -->
    <a th:href="@{/api/posts/{userId}/edit/{postId}(userId=${post.user.id}, postId=${post.id})}"
       class="flex items-center gap-2 bg-yellow-400 text-white px-4 py-2 rounded-full hover:bg-yellow-500 transition duration-300">
      <i class="fas fa-edit"></i> Edit
    </a>
  </div>
</div>

</body>
</html>
