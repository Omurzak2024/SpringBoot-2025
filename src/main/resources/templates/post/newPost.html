<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Post</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.1.2/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 p-8">
<div class="max-w-lg mx-auto bg-white p-6 rounded-lg shadow-md">
    <h2 class="text-2xl font-semibold mb-4">Create a New Post</h2>
    <form action="#" th:action="@{/post/{userId}/save(userId={userId})}" th:object="${newPost}" th:method="POST">
        <div class="mb-4">
            <label class="block text-gray-700" for="title">Title</label>
            <input type="text" id="title" th:field="*{title}" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter title">
        </div>

        <div class="mb-4">
            <label class="block text-gray-700" for="description">Description</label>
            <input type="text" id="description" th:field="*{description}" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter description">
        </div>

        <div class="mb-4">
            <label class="block text-gray-700" for="image">Image</label>
            <input type="file" id="image" th:field="*{image}" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div class="mb-4">
            <label class="block text-gray-700" for="date">Date</label>
            <input type="date" id="date" th:field="*{date}" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div class="mt-6">
            <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500">Save Post</button>
        </div>
    </form>
</div>
</body>
</html>
