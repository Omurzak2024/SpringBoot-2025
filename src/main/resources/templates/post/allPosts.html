<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Бардык Посттор</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">

<h1 class="text-center mb-4">Посттор</h1>

<!-- Эгер пост жок болсо билдирүү көрсөтүү -->
<div th:if="${#lists.isEmpty(posts)}" class="alert alert-warning text-center">
    Посттор табылган жок.
</div>

<!-- Постторду карточка түрүндө көрсөтүү -->
<div class="row" th:if="${!#lists.isEmpty(posts)}">
    <div class="col-md-4 mb-4" th:each="post : ${posts}">
        <div class="card h-100 shadow-sm">
            <img th:src="${post.image}" class="card-img-top" alt="Post Image">
            <div class="card-body">
                <h5 class="card-title" th:text="${post.title}">Post Title</h5>
                <p class="card-text" th:text="${post.description}">Post Description</p>
            </div>
            <div class="card-footer text-muted">
                <small th:text="${post.date}">Date</small>
            </div>
        </div>
    </div>
</div>

<!-- Жаңы пост кошуу кнопкасы -->
<div class="text-center mt-5">
    <a th:href="@{/api/posts/{id}/new(id=${userId})}" class="btn btn-primary">
        Жаңы пост кошуу
    </a>
</div>

</body>
</html>
