<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>All Posts</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 p-8">

<div class="max-w-6xl mx-auto bg-white p-6 rounded-lg shadow-md">
    <h2 class="text-2xl font-bold mb-6 text-center text-blue-600">All Posts</h2>

    <!-- Posts list -->
    <div th:each="post : ${posts}" class="border-b py-4">
        <h3 class="font-semibold text-xl text-gray-800" th:text="${post.title}"></h3>
        <p class="text-gray-600" th:text="${post.description}"></p>

        <div class="flex gap-2 mt-2">
            <!-- View button -->
            <a th:href="@{/api/posts/{userId}/view/{postId}(userId=${userId}, postId=${post.id})}"
               class="bg-green-500 text-white px-3 py-1 rounded hover:bg-green-600">View</a>

            <!-- Edit button -->
            <a th:href="@{/api/posts/{userId}/edit/{postId}(userId=${userId}, postId=${post.id})}"
               class="bg-yellow-500 text-white px-3 py-1 rounded hover:bg-yellow-600">Edit</a>

            <!-- Delete button -->
            <a th:href="@{/api/posts/{userId}/delete/{postId}(userId=${userId}, postId=${post.id})}"
               onclick="return confirm('Are you sure you want to delete this post?')"
               class="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600">Delete</a>
        </div>
    </div>


    <!-- Create New Post button -->
    <div class="mt-8 text-center">
        <a th:href="@{/api/posts/{userId}/new(userId=${userId})}">
            <button class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">
                Create New Post
            </button>
        </a>
    </div>
</div>

</body>
</html>
