<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Search Results</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 p-8">

<div class="max-w-6xl mx-auto bg-white p-6 rounded-lg shadow-md">
    <h2 class="text-2xl font-bold mb-6 text-center text-blue-600">
        Search results for "<span th:text="${word}"></span>"
    </h2>

    <!-- Search bar again (optional) -->
    <form th:action="@{/api/posts/{userId}/search(userId=${userId})}" method="get" class="mb-6 flex justify-center">
    <input type="text" name="word" placeholder="Search again..." class="px-4 py-2 w-1/2 border border-gray-300 rounded-l-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded-r-md hover:bg-blue-600">Search</button>
    </form>

    <div th:if="${posts}">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-blue-500 text-white">
            <tr>
                <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Title</th>
                <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Description</th>
                <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Date</th>
                <th class="px-6 py-3 text-center text-xs font-medium uppercase tracking-wider">Actions</th>
            </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
            <tr th:each="post : ${posts}" class="hover:bg-gray-100">
                <td class="px-6 py-4" th:text="${post.title}">Sample Title</td>
                <td class="px-6 py-4" th:text="${post.description}">Sample Description</td>
                <td class="px-6 py-4" th:text="${post.date}">2025-04-29</td>
                <td class="px-6 py-4 text-center space-x-2">
                    <a th:href="@{/api/posts/{userId}/view/{postId}(userId=${post.user.id}, postId=${post.id})}" class="bg-green-500 text-white px-3 py-1 rounded hover:bg-green-600">View</a>
                    <a th:href="@{/api/posts/{userId}/edit/{postId}(userId=${post.user.id}, postId=${post.id})}" class="bg-yellow-400 text-white px-3 py-1 rounded hover:bg-yellow-500">Edit</a>
                    <a th:href="@{/api/posts/{userId}/delete/{postId}(userId=${post.user.id}, postId=${post.id})}"
                       onclick="return confirm('Are you sure you want to delete this post?');"
                       class="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600">Delete</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:if="${#lists.isEmpty(posts)}" class="text-center text-gray-500 mt-6">
        <p>No results found for "<span th:text="${word}"></span>".</p>
    </div>
</div>

</body>
</html>
